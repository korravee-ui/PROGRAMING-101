<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — IHC-BD&PD Dashboard</title>
  <style>
    :root {
      --primary: #0066cc;
      --primary-dk: #0054aa;
      --primary-lt: #e8f0fb;
      --ink: #1d1d1f;
      --ink-soft: #333;
      --ink-muted: #6e6e73;
      --bg: #f5f5f7;
      --canvas: #fff;
      --border: #d2d2d7;
      --border-soft: #e8e8ed;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --purple: #5856d6;
      --r-card: 14px;
      --r-pill: 9999px;
      --r-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ── CARD ── */
    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 2.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      font-size: 13px;
      color: var(--ink-muted);
    }

    /* ── TABS ── */
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .auth-tab.active {
      border-bottom-color: var(--primary);
      color: var(--primary);
    }

    /* ── FORM ── */
    .auth-form {
      display: none;
    }

    .auth-form.show {
      display: block;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
      letter-spacing: 0.02em;
    }

    .form-field input {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: var(--canvas);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.4;
    }

    .form-field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }

    .form-field .hint {
      font-size: 10px;
      color: var(--ink-muted);
      margin-top: 0.1rem;
    }

    .form-field .error {
      font-size: 10px;
      color: var(--red);
      margin-top: 0.1rem;
    }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      padding: 10px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      outline: none;
    }

    .btn:hover {
      background: var(--primary-dk);
    }

    .btn:disabled {
      background: var(--ink-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn.loading {
      position: relative;
      color: transparent;
    }

    .btn.loading::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      top: 50%;
      left: 50%;
      margin-left: -7px;
      margin-top: -7px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── DIVIDER ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--ink-muted);
      font-size: 12px;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── MESSAGE ── */
    .message {
      padding: 0.75rem 1rem;
      border-radius: var(--r-sm);
      font-size: 12px;
      margin-bottom: 1rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 59, 48, 0.1);
      color: var(--red);
      border: 1px solid rgba(255, 59, 48, 0.2);
    }

    .message.success {
      background: rgba(52, 199, 89, 0.1);
      color: var(--green);
      border: 1px solid rgba(52, 199, 89, 0.2);
    }

    /* ── LINK ── */
    .auth-link {
      text-align: center;
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 1rem;
    }

    .auth-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    /* ── DEMO NOTICE ── */
    .demo-notice {
      background: var(--primary-lt);
      border: 1px solid rgba(0, 102, 204, 0.2);
      border-radius: var(--r-sm);
      padding: 1rem;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .demo-notice strong {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <h1>IHC-BD&PD Dashboard</h1>
        <p>เข้าสู่ระบบเพื่อจัดการข้อมูล</p>
      </div>

      <!-- Demo Notice -->
      <div class="demo-notice">
        <strong>📝 Test Credentials (Demo):</strong><br>
        Email: <code>demo@example.com</code><br>
        Password: <code>Demo123456</code>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
        <button class="auth-tab" onclick="switchTab('register')">สร้างบัญชี</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form show" onsubmit="handleLogin(event)">
        <div id="loginMessage" class="message"></div>

        <div class="form-field">
          <label>อีเมล</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>

        <div class="form-field">
          <label>รหัสผ่าน</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn" id="loginBtn">เข้าสู่ระบบ</button>

        <div class="auth-link">
          <a href="#" onclick="showResetPassword(event)">ลืมรหัสผ่าน?</a>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div id="registerMessage" class="message"></div>

        <div class="form-field">
          <label>ชื่อ-นามสกุล (ตัวเลือก)</label>
          <input type="text" id="registerName" placeholder="นาย/นาง...">
        </div>

        <div class="form-field">
          <label>อีเมล</label>
          <input type="email" id="registerEmail" placeholder="your@email.com" required>
        </div>

        <div class="form-field">
          <label>รหัสผ่าน</label>
          <input type="password" id="registerPassword" placeholder="••••••••" required>
          <div class="hint">อย่างน้อย 6 ตัวอักษร</div>
        </div>

        <div class="form-field">
          <label>ยืนยันรหัสผ่าน</label>
          <input type="password" id="registerPasswordConfirm" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn" id="registerBtn">สร้างบัญชี</button>

        <div class="auth-link">
          ✓ โดยการสร้างบัญชี ฉันยอมรับ<br>
          <a href="#" onclick="alert('Terms of Service')">เงื่อนไขการบริการ</a> และ
          <a href="#" onclick="alert('Privacy Policy')">นโยบายความเป็นส่วนตัว</a>
        </div>
      </form>
    </div>
  </div>

  <script>window.location.replace("index.html");</script>
</body>
</html>
